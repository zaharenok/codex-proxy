<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex Proxy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #111111;
      --surface: #1e1e2e;
      --surface2: #313244;
      --surface3: #45475a;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --overlay: #6c7086;
      --blue: #89b4fa;
      --green: #a6e3a1;
      --red: #f38ba8;
      --yellow: #f9e2af;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 520px;
      height: 660px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .container { padding: 24px 28px; }
    .header { display: flex; align-items: center; margin-bottom: 4px; }
    .header-icon { font-size: 28px; margin-right: 12px; }
    .header-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 11px; color: var(--subtext); margin-top: 2px; }
    .divider { height: 1px; background: var(--surface3); margin: 14px 0 16px; }
    .field { margin-bottom: 14px; }
    .field-label {
      font-size: 10px; font-weight: 700; color: var(--overlay);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px;
    }
    select, input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      font-size: 13px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--surface3);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    select { cursor: pointer; appearance: auto; }
    input:focus, select:focus { border-color: var(--blue); }
    input::placeholder { color: var(--overlay); }
    .key-row { display: flex; gap: 6px; }
    .key-row input { flex: 1; }
    .key-row button {
      background: var(--surface2); color: var(--subtext);
      border: 1px solid var(--surface3); border-radius: 8px;
      padding: 0 14px; cursor: pointer; font-size: 16px;
      transition: background 0.15s;
    }
    .key-row button:hover { background: var(--surface3); }
    .status-bar {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border-radius: 10px;
      padding: 12px 16px; margin: 6px 0 16px;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--overlay); flex-shrink: 0;
    }
    .status-dot.running { background: var(--green); }
    .status-dot.error { background: var(--red); }
    .status-text { font-size: 12px; color: var(--subtext); }
    .btn-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn {
      flex: 1; padding: 10px; border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: var(--green); color: var(--bg); }
    .btn-stop { background: var(--red); color: var(--bg); }
    .btn-start:hover:not(:disabled) { opacity: 0.85; }
    .btn-stop:hover:not(:disabled) { opacity: 0.85; }
    .links { display: flex; gap: 16px; }
    .link {
      font-size: 11px; color: var(--subtext); cursor: pointer;
      text-decoration: none; transition: color 0.15s;
    }
    .link:hover { color: var(--text); }
    .model-select { margin-bottom: 0; }
    .model-select select { font-size: 12px; padding: 8px 12px; }
    .spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid var(--surface3);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-left: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-icon">⚡</div>
      <div>
        <div class="header-title">Codex Proxy</div>
        <div class="header-sub">Responses API ↔ Chat Completions / Anthropic</div>
      </div>
    </div>
    <div class="divider"></div>

    <!-- Provider -->
    <div class="field">
      <div class="field-label">Provider</div>
      <select id="preset" onchange="onPresetChange()"></select>
    </div>

    <!-- Upstream URL -->
    <div class="field">
      <div class="field-label">Upstream URL</div>
      <input type="text" id="upstream" placeholder="https://api.example.com" oninput="onUpstreamChange()">
    </div>

    <!-- API Key -->
    <div class="field">
      <div class="field-label">API Key</div>
      <div class="key-row">
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
        <button id="toggleKey" onclick="toggleKey()" title="Toggle visibility">👁</button>
      </div>
    </div>

    <!-- Port -->
    <div class="field">
      <div class="field-label">Port</div>
      <input type="text" id="port" value="9090" style="width: 100px;">
    </div>

    <!-- Model selector -->
    <div class="field model-select" id="modelField" style="display:none;">
      <div class="field-label">Model (optional)</div>
      <select id="modelSelect"><option value="">Default</option></select>
    </div>

    <!-- Status -->
    <div class="status-bar">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Stopped</div>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
      <button class="btn btn-start" id="startBtn" onclick="onStart()">▶ Start</button>
      <button class="btn btn-stop" id="stopBtn" onclick="onStop()" disabled>⏹ Stop</button>
    </div>

    <!-- Links -->
    <div class="links">
      <a class="link" onclick="onInstallConfig()">📋 Install Codex Config</a>
      <a class="link" onclick="onOpenLogs()">📖 Logs</a>
      <a class="link" onclick="onOpenConfig()">⚙ Config</a>
      <a class="link" onclick="onLaunchCodex()">🚀 Launch Codex</a>
    </div>
  </div>

  <script>
    // Tauri invoke with fallback to pywebview for backward compat
    const isTauri = window.__TAURI_INTERNALS__ !== undefined;

    async function invoke(cmd, args = {}) {
      if (isTauri) {
        const { invoke: tauriInvoke } = window.__TAURI_INTERNALS__;
        return tauriInvoke(cmd, args);
      } else if (window.pywebview) {
        // Fallback for old pywebview
        return window.pywebview.api[cmd](...Object.values(args));
      }
      throw new Error('No runtime available');
    }

    let isRunning = false;
    let currentPreset = '';
    let keyVisible = false;

    // Load presets and settings on init
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const presets = await invoke('get_presets_list');
        const sel = document.getElementById('preset');
        presets.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          sel.appendChild(opt);
        });

        const settings = await invoke('load_settings');
        if (settings.preset) {
          sel.value = settings.preset;
          currentPreset = settings.preset;
          document.getElementById('upstream').value = settings.upstream || '';
          document.getElementById('port').value = settings.port || 9090;
          onPresetChange();
        }
      } catch (e) {
        console.error('Init error:', e);
      }
    });

    async function onPresetChange() {
      const preset = document.getElementById('preset').value;
      currentPreset = preset;

      if (preset === 'Custom') {
        document.getElementById('upstream').readOnly = false;
        document.getElementById('modelField').style.display = 'block';
        return;
      }

      document.getElementById('upstream').readOnly = true;
      try {
        const url = await invoke('get_preset_url', { presetName: preset });
        document.getElementById('upstream').value = url;
      } catch (e) {
        console.error(e);
      }
      document.getElementById('modelField').style.display = 'none';
    }

    function onUpstreamChange() {
      if (currentPreset === 'Custom') {
        document.getElementById('modelField').style.display = 'block';
      }
    }

    function toggleKey() {
      keyVisible = !keyVisible;
      const input = document.getElementById('apiKey');
      input.type = keyVisible ? 'text' : 'password';
      document.getElementById('toggleKey').textContent = keyVisible ? '🙈' : '👁';
    }

    async function onStart() {
      if (isRunning) return;

      const preset = document.getElementById('preset').value;
      const upstream = document.getElementById('upstream').value.trim();
      const apiKey = document.getElementById('apiKey').value.trim();
      const port = parseInt(document.getElementById('port').value.trim()) || 9090;
      const selectedModel = document.getElementById('modelSelect').value || null;

      if (!apiKey) {
        setStatus('Enter your API key first', 'error');
        return;
      }

      setStatus('Starting...', '');

      try {
        const result = await invoke('start_proxy', {
          args: { preset, upstream, apiKey, port, selectedModel }
        });

        if (result.ok) {
          isRunning = true;
          document.getElementById('startBtn').disabled = true;
          document.getElementById('stopBtn').disabled = false;
          setStatus(`Running → localhost:${port} → ${result.upstream}`, 'running');
        } else {
          setStatus(result.error || 'Failed to start', 'error');
        }
      } catch (e) {
        setStatus(`Error: ${e}`, 'error');
      }
    }

    async function onStop() {
      if (!isRunning) return;

      try {
        await invoke('stop_proxy');
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        setStatus('Stopped', '');
      } catch (e) {
        console.error(e);
      }
    }

    async function onInstallConfig() {
      const port = parseInt(document.getElementById('port').value.trim()) || 9090;
      try {
        const msg = await invoke('install_config', { port });
        setStatus(msg, 'running');
      } catch (e) {
        setStatus(`Error: ${e}`, 'error');
      }
    }

    async function onOpenLogs() {
      try { await invoke('open_logs'); } catch (e) { console.error(e); }
    }

    async function onOpenConfig() {
      try { await invoke('open_config_folder'); } catch (e) { console.error(e); }
    }

    async function onLaunchCodex() {
      try { await invoke('launch_codex_cli'); } catch (e) { console.error(e); }
    }

    function setStatus(text, state) {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot' + (state === 'running' ? ' running' : state === 'error' ? ' error' : '');
    }

    // Periodic health check
    setInterval(async () => {
      if (!isRunning) return;
      try {
        const res = await fetch('http://127.0.0.1:' + (document.getElementById('port').value.trim() || 9090) + '/health');
        if (!res.ok) throw new Error('Not ok');
      } catch {
        isRunning = false;
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        setStatus('Connection lost', 'error');
      }
    }, 5000);
  </script>
</body>
</html>
