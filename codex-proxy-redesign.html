<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Codex Proxy</title>
  <style>
    :root {
      --bg:      #111111;
      --surface: #1a1a1a;
      --surface2:#252525;
      --fg:      #e8e8e8;
      --muted:   #888;
      --border:  #ccc;
      --accent:  #c8ff00;
      --danger:  #ff4444;
      --warning: #ffaa00;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      --bw: 2px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---- Header ---- */
    .header {
      padding: 14px 20px;
      border-bottom: var(--bw) solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      flex-shrink: 0;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border: var(--bw) solid var(--fg);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      box-shadow: 4px 4px 0 var(--fg);
    }
    .header-icon svg { width: 18px; height: 18px; }
    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--fg);
      text-transform: uppercase;
    }
    .header-text p {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
      letter-spacing: 0.02em;
    }

    /* ---- Main content ---- */
    .main {
      flex: 1;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    /* ---- Form fields ---- */
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .field-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .field input,
    .field select {
      width: 100%;
      background: var(--bg);
      border: var(--bw) solid var(--border);
      padding: 8px 10px;
      color: var(--fg);
      font-size: 12px;
      font-family: var(--font-mono);
      outline: none;
    }
    .field input:focus,
    .field select:focus {
      outline: var(--bw) solid var(--accent);
      outline-offset: -2px;
    }
    .field select {
      appearance: none;
      cursor: pointer;
      padding-right: 32px;
    }
    .field-input-wrap .select-arrow {
      position: absolute;
      right: 10px;
      pointer-events: none;
      color: var(--fg);
    }
    .field-input-wrap .toggle-vis {
      position: absolute;
      right: 6px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      display: grid;
      place-items: center;
    }
    .field-input-wrap .toggle-vis:hover { color: var(--accent); }

    /* ---- Status bar ---- */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--surface);
      border: var(--bw) solid var(--border);
      box-shadow: 5px 5px 0 var(--border);
      flex-shrink: 0;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 12px;
      height: 12px;
      background: var(--muted);
    }
    .status-dot.running {
      background: var(--accent);
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }
    .status-label {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }
    .status-label.running {
      color: var(--accent);
      text-shadow: 2px 2px 0 rgba(191, 255, 0, 0.2);
    }
    .status-port {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      background: var(--bg);
      padding: 3px 8px;
      border: var(--bw) solid var(--border);
    }
    .status-port span { color: var(--fg); }

    /* ---- Controls ---- */
    .controls {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border: var(--bw) solid var(--border);
      background: var(--surface);
      color: var(--fg);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
      font-family: var(--font-mono);
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--surface2);
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--border);
    }
    .btn:active {
      transform: translate(0, 0);
      box-shadow: none;
    }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--fg);
      color: #0a0a0a;
    }
    .btn-primary:hover {
      background: var(--accent);
      box-shadow: 5px 5px 0 var(--fg);
    }
    .btn-primary:disabled {
      opacity: 0.3;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .btn-danger {
      background: rgba(255, 68, 68, 0.18);
      border-color: var(--danger);
      color: var(--danger);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: #fff;
      box-shadow: 4px 4px 0 var(--danger);
    }
    .btn-danger:disabled {
      opacity: 0.3;
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    /* ---- Footer actions ---- */
    .footer {
      padding: 10px 20px;
      border-top: var(--bw) solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: var(--surface);
      flex-shrink: 0;
    }
    .footer .btn {
      font-size: 10px;
      padding: 6px 10px;
    }

    /* ---- Row layout ---- */
    .field-row {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 10px;
    }

    /* ---- Logging area ---- */
    .log-panel {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      border: var(--bw) solid var(--border);
      overflow: hidden;
      height: 280px;
      flex-shrink: 0;
    }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-bottom: var(--bw) solid var(--border);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
      color: var(--accent);
      background: var(--surface);
      flex-shrink: 0;
    }
    .log-header-actions {
      display: flex;
      gap: 8px;
    }
    .log-header-actions button {
      background: none;
      border: none;
      color: var(--fg);
      cursor: pointer;
      font-size: 10px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0;
    }
    .log-header-actions button:hover { color: var(--accent); }
    .log-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.6;
      color: #888;
    }
    .log-body .log-ts {
      color: var(--muted);
      margin-right: 6px;
    }
    .log-body .log-ok { color: var(--accent); font-weight: 700; }
    .log-body .log-err { color: var(--danger); font-weight: 700; }

    /* Scrollbar */
    .log-body::-webkit-scrollbar { width: 5px; }
    .log-body::-webkit-scrollbar-track { background: var(--bg); }
    .log-body::-webkit-scrollbar-thumb { background: var(--fg); }

    /* ---- Alert ---- */
    .alert {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border: var(--bw) solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      z-index: 100;
      animation: slideIn 0.15s ease-out;
    }
    .alert-ok { background: var(--accent); color: #0a0a0a; }
    .alert-err { background: var(--danger); color: #fff; }
    @keyframes slideIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }
    @keyframes fadeHint { from { opacity:0; } to { opacity:1; } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Codex Proxy</h1>
      <p>Responses API ↔ Chat Completions / Anthropic</p>
    </div>
  </div>

  <!-- Main config -->
  <div class="main">

    <!-- Provider + Port row -->
    <div class="field-row">
      <div class="field">
        <label>Provider</label>
        <div class="field-input-wrap">
          <select id="provider" onchange="onProviderChange()">
            <option value="z.ai">z.ai</option>
            <option value="DeepSeek V4 Pro">DeepSeek V4 Pro</option>
            <option value="OpenRouter">OpenRouter</option>
            <option value="LM Studio">LM Studio</option>
            <option value="Ollama">Ollama</option>
            <option value="MiniMax">MiniMax</option>
            <option value="OpenCode">OpenCode</option>
            <option value="custom">Custom</option>
          </select>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4.5L6 7.5L9 4.5"/></svg>
        </div>
      </div>
      <div class="field">
        <label>Port</label>
        <input type="number" id="port" value="9090" />
      </div>
    </div>

    <!-- Upstream URL -->
    <div class="field">
      <label>Upstream URL</label>
      <input type="url" id="upstream-url" value="https://api.deepseek.com" />
    </div>

    <!-- API Key + Validate -->
    <div class="field-row">
      <div class="field" style="flex:1;">
        <label>API Key</label>
        <div class="field-input-wrap">
          <input type="password" id="api-key" value="" placeholder="sk-..." />
          <button class="toggle-vis" id="toggle-key" aria-label="Toggle visibility" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="field" style="flex:0 0 auto;">
        <label>&nbsp;</label>
        <button class="btn" id="btn-validate-key" style="padding:7px 10px;font-size:10px;height:100%;">Validate Key</button>
      </div>
    </div>

    <!-- Model select (shown after validation) -->
    <div id="model-section" style="display:none;">
      <div class="field">
        <label>Model</label>
        <div class="field-input-wrap">
          <input type="text" id="model-filter" placeholder="Search models..." style="width:100%;height:32px;box-sizing:border-box;" />
        </div>
      </div>
      <div class="field" style="margin-top:4px;">
        <select id="model-select" style="width:100%;height:120px;" size="6">
          <option value="">— validate key to load models —</option>
        </select>
        <div id="model-scroll-hint" style="display:none;font-size:10px;color:var(--muted);text-align:center;line-height:1;margin-top:-2px;animation:fadeHint .4s;">↓ scroll</div>
      </div>
      <div id="model-status" style="font-size:10px;margin-top:2px;min-height:16px;"></div>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-left">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-label" id="status-label">Stopped</span>
      </div>
      <div class="status-port">:<span id="status-port-num">9090</span></div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-primary" id="btn-start" style="flex:1">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6,3 20,12 6,21"/></svg>
        Start
      </button>
      <button class="btn btn-danger" id="btn-stop" disabled style="flex:1">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="4" width="16" height="16"/></svg>
        Stop
      </button>
    </div>

    <!-- Logs -->
    <div class="log-panel" id="log-panel">
      <div class="log-header">
        <span>▸ Logs</span>
        <div class="log-header-actions">
          <button onclick="copyLogs()">Copy</button>
          <button onclick="clearLogs()">Clear</button>
        </div>
      </div>
      <div class="log-body" id="log-body"></div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn" id="btn-install">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Install Config
    </button>
    <button class="btn" id="btn-restore">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      Restore Config
    </button>
    <button class="btn" id="btn-restore-original" style="border-color:var(--warning);color:var(--warning)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 3 3 9 9 9"/></svg>
      Original
    </button>
      <button class="btn" id="btn-launch-codex" style="border-color:var(--accent);color:var(--accent)">
        Codex CLI
      </button>
      <button class="btn" id="btn-launch-codex-app" style="border-color:var(--accent);color:var(--accent)">
        Codex App
      </button>
    <button class="btn" id="btn-config">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Config
    </button>
  </div>

  <script>
    let running = false;

    const PRESETS = {
      'z.ai':            { url: 'https://api.z.ai/api/anthropic',           api_type: 'anthropic' },
      'DeepSeek V4 Pro': { url: 'https://api.deepseek.com',                 api_type: 'openai' },
      'OpenRouter':      { url: 'https://openrouter.ai/api/v1',             api_type: 'openai' },
      'MiniMax':         { url: 'https://api.minimax.chat/v1',              api_type: 'openai' },
      'OpenCode':        { url: 'https://opencode.ai/ru/go',                api_type: 'openai' },
      'LM Studio':       { url: 'http://localhost:1234/v1',                 api_type: 'openai' },
      'Ollama':          { url: 'http://localhost:11434/v1',                api_type: 'openai' },
    };

    const dot = document.getElementById('status-dot');
    const label = document.getElementById('status-label');
    const portNum = document.getElementById('status-port-num');
    const portInput = document.getElementById('port');
    const providerSelect = document.getElementById('provider');
    const upstreamInput = document.getElementById('upstream-url');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const toggleKey = document.getElementById('toggle-key');
    const apiKeyInput = document.getElementById('api-key');
    const modelSection = document.getElementById('model-section');
    const modelSelect = document.getElementById('model-select');
    const modelFilter = document.getElementById('model-filter');
    const modelStatus = document.getElementById('model-status');
    const btnValidateKey = document.getElementById('btn-validate-key');
    const logBody = document.getElementById('log-body');

    function onProviderChange() {
      const val = providerSelect.value;
      if (PRESETS[val]) upstreamInput.value = PRESETS[val].url;
      apiKeyInput.value = '';
      modelSection.style.display = 'none';
      modelStatus.textContent = '';
      modelFilter.value = '';
      modelSelect.innerHTML = '<option value="">— validate key to load models —</option>';
      _allModelOptions = [];
      pywebview.api.get_key(val).then(k => { if (k) apiKeyInput.value = k; });
    }
    portInput.addEventListener('input', () => { portNum.textContent = portInput.value || '—'; });

    // Model filter: rebuild select with matching models only
    // (WebKit/WKWebView doesn't support display:none on <option>)
    let _allModelOptions = [];
    function _rebuildModelOptions() {
      _allModelOptions = [];
      for (const opt of modelSelect.options) {
        if (opt.value) _allModelOptions.push({ value: opt.value, text: opt.text });
      }
    }
    modelFilter.addEventListener('input', () => {
      const q = modelFilter.value.toLowerCase();
      const value = modelSelect.value;
      if (!_allModelOptions.length) _rebuildModelOptions();
      const filtered = !q
        ? _allModelOptions
        : _allModelOptions.filter(o => o.value && o.text.toLowerCase().includes(q));
      modelSelect.innerHTML = '';
      for (const o of filtered) {
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.text;
        modelSelect.add(opt);
      }
      if (filtered.some(o => o.value === value)) modelSelect.value = value;
      else if (filtered.length) modelSelect.value = filtered[0].value;
      else modelSelect.innerHTML = '<option value="">— no match —</option>';
      const hint = document.getElementById('model-scroll-hint');
      if (hint) hint.style.display = (q && filtered.length > 6) ? '' : 'none';
    });

    // Start
    btnStart.addEventListener('click', async () => {
      if (running) {
        try { await pywebview.api.stop_proxy(); } catch(e) {}
        running = false;
        dot.classList.remove('running');
        label.classList.remove('running');
        label.textContent = 'Stopped';
        btnStart.disabled = false;
        btnStop.disabled = true;
      }
      const key = apiKeyInput.value.trim();
      if (!key) { showNotice('err', 'Enter API key first'); return; }
      try {
        const model = modelSelect.value.trim() || null;
        const r = await pywebview.api.start_proxy(providerSelect.value, upstreamInput.value.trim(), key, parseInt(portInput.value) || 9090, model);
        if (r.error) { showNotice('err', r.error); return; }
        pywebview.api.store_key(providerSelect.value, key);
        running = true;
        dot.classList.add('running');
        label.classList.add('running');
        label.textContent = 'Running';
        btnStart.disabled = true;
        btnStop.disabled = false;
        addLog('ok', 'Proxy started → ' + r.upstream);
        // Launch Codex automatically
        try { await pywebview.api.launch_codex_app(); addLog('ok', 'Codex.app launched'); } catch(e2) { addLog('err', 'Launch Codex: ' + e2.message); }
      } catch(e) { showNotice('err', e.message); }
    });

    // Stop
    btnStop.addEventListener('click', async () => {
      if (!running) return;
      try { await pywebview.api.stop_proxy(); } catch(e) {}
      running = false;
      dot.classList.remove('running');
      label.classList.remove('running');
      label.textContent = 'Stopped';
      btnStart.disabled = false;
      btnStop.disabled = true;
      addLog('info', 'Proxy stopped — Codex config restored to original');
    });

    // Key toggle
    let keyVisible = false;
    toggleKey.addEventListener('click', () => {
      keyVisible = !keyVisible;
      apiKeyInput.type = keyVisible ? 'text' : 'password';
    });

    // Validate key → fetch models → populate model select
    btnValidateKey.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      if (!key) { modelStatus.textContent = 'Enter API key first'; return; }
      modelSection.style.display = '';
      modelSelect.innerHTML = '<option value="">— loading —</option>';
      modelFilter.value = '';
      modelStatus.textContent = 'Validating key...';
      modelStatus.style.color = '';
      const preset = providerSelect.value;
      try {
        const vr = await pywebview.api.validate_key(preset, key);
        if (!vr.valid) {
          modelSelect.innerHTML = '<option value="">— validation failed —</option>';
          const errMsg = '✗ Invalid key (HTTP ' + (vr.status || vr.error) + ')';
          modelStatus.textContent = errMsg;
          modelStatus.style.color = '#ff6b6b';
          addLog('err', errMsg);
          return;
        }
        modelStatus.textContent = '✓ Key valid, fetching models...';
        addLog('ok', '✓ Key valid for ' + preset);
        pywebview.api.store_key(preset, key);
        const mr = await pywebview.api.fetch_models(preset, key);
        if (mr.models && mr.models.length) {
          const opts = mr.models.map(m => '<option value="' + m.replace(/"/g,'&quot;') + '">' + m + '</option>').join('');
          modelSelect.innerHTML = opts;
          _rebuildModelOptions();
          const defaultModel = mr.models.find(m => m.includes('deepseek-chat')) || mr.models[0];
          modelSelect.value = defaultModel;
          modelStatus.textContent = '✓ ' + mr.models.length + ' models loaded';
          modelStatus.style.color = '#50e3a0';
          addLog('ok', '✓ ' + mr.models.length + ' models loaded for ' + preset);
        } else {
          modelSelect.innerHTML = '<option value="">— no models —</option>';
          const errMsg = '✗ ' + (mr.error || 'No models returned');
          modelStatus.textContent = errMsg;
          modelStatus.style.color = '#ff6b6b';
          addLog('err', errMsg);
        }
      } catch(e) {
        modelSelect.innerHTML = '<option value="">— error —</option>';
        const errMsg = '✗ ' + e.message;
        modelStatus.textContent = errMsg;
        modelStatus.style.color = '#ff6b6b';
        addLog('err', errMsg);
      }
    });

    // Log helpers
    function addLog(type, msg) {
      const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
      const cls = type === 'ok' ? 'log-ok' : type === 'err' ? 'log-err' : '';
      logBody.innerHTML += '<div><span class="log-ts">' + ts + '</span><span class="' + cls + '">' + msg + '</span></div>';
      logBody.scrollTop = logBody.scrollHeight;
    }
    function copyLogs() {
      const text = logBody.innerText;
      navigator.clipboard.writeText(text).then(() => showNotice('ok', 'Logs copied'));
    }
    function clearLogs() { logBody.innerHTML = ''; }

    // Notice
    function showNotice(type, msg) {
      const el = document.createElement('div');
      el.className = 'alert alert-' + type;
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2500);
    }

    // Footer
    document.getElementById('btn-install').addEventListener('click', async () => {
      try {
        const r = await pywebview.api.install_config(parseInt(portInput.value) || 9090);
        showNotice(r.ok ? 'ok' : 'err', r.message);
        addLog(r.ok ? 'ok' : 'err', r.message);
      } catch(e) { showNotice('err', e.message); }
    });
    document.getElementById('btn-restore').addEventListener('click', async () => {
      try {
        const r = await pywebview.api.restore_config();
        showNotice(r.ok ? 'ok' : 'err', r.message);
        addLog(r.ok ? 'ok' : 'err', r.message);
      } catch(e) { showNotice('err', e.message); }
    });
    document.getElementById('btn-launch-codex').addEventListener('click', async () => {
      try {
        await pywebview.api.launch_codex();
        addLog('ok', 'Codex launched (CLI)');
      } catch(e) { addLog('err', e.message); }
    });
    document.getElementById('btn-launch-codex-app').addEventListener('click', async () => {
      try {
        await pywebview.api.launch_codex_app();
        addLog('ok', 'Codex.app launched');
      } catch(e) { addLog('err', e.message); }
    });
    document.getElementById('btn-config').addEventListener('click', async () => {
      try { await pywebview.api.open_config(); } catch(e) {}
    });
    document.getElementById('btn-restore-original').addEventListener('click', async () => {
      try {
        const r = await pywebview.api.restore_original_config();
        showNotice(r.ok ? 'ok' : 'err', r.message);
        addLog(r.ok ? 'ok' : 'err', r.message);
      } catch(e) { showNotice('err', e.message); }
    });

    // Load saved settings
    window.addEventListener('pywebviewready', async () => {
      try {
        const s = await pywebview.api.load_settings();
        if (s.preset) providerSelect.value = s.preset;
        if (s.port) { portInput.value = s.port; portNum.textContent = s.port; }
        onProviderChange();
        if (s.upstream && !PRESETS[s.preset]) upstreamInput.value = s.upstream;
        if (s.selected_model) {
          if (!modelSelect.querySelector('option[value="' + s.selected_model.replace(/"/g,'&quot;') + '"]')) {
            modelSelect.insertAdjacentHTML('beforeend', '<option value="' + s.selected_model.replace(/"/g,'&quot;') + '">' + s.selected_model + '</option>');
          }
          modelSelect.value = s.selected_model;
          modelSection.style.display = '';
        }
        pywebview.api.save_original_config().then(r => {
          if (r.message && !r.message.includes('already')) addLog('info', r.message);
        });
        addLog('info', 'Ready. Press Start → then open Codex.app');
      } catch(e) { addLog('err', e.message); }
    });
  </script>
</body>
</html>
